name: Sync quote data

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [airsync]

concurrency:
  group: shanshui-quote-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WPS_STORAGE_STATE_FILE: /tmp/wps-storage-state.json
      WPS_STORAGE_STATE_OUTPUT: /tmp/wps-storage-state-updated.json
      WPS_SKIP_IMAGES: '1'
      CATALOG_PASSPHRASE: ${{ secrets.CATALOG_PASSPHRASE }}
      VITE_CATALOG_PASSPHRASE: ${{ secrets.CATALOG_PASSPHRASE }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Chrome
        run: |
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$chrome_bin"
          echo "CHROME_EXECUTABLE=$chrome_bin" >> "$GITHUB_ENV"

      - name: Restore WPS session
        env:
          WPS_STORAGE_STATE_GZ_B64: ${{ secrets.WPS_STORAGE_STATE_GZ_B64 }}
        run: |
          if [ -f secrets/wps-state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -salt \
              -pass env:CATALOG_PASSPHRASE \
              -in secrets/wps-state.enc \
              -out "$WPS_STORAGE_STATE_FILE"
          else
            printf '%s' "$WPS_STORAGE_STATE_GZ_B64" | base64 -d | gunzip > "$WPS_STORAGE_STATE_FILE"
          fi
          chmod 600 "$WPS_STORAGE_STATE_FILE"

      - name: Sync original workbook
        run: npm run sync

      - name: Encrypt and build
        run: |
          npm run protect
          npm run build

      - name: Deploy to EdgeOne
        run: |
          npx edgeone makers deploy dist \
            --name shanshui-quote-public \
            --env production \
            --area overseas \
            --skip-ai-gateway-sync \
            --token "$EDGEONE_API_TOKEN"

      - name: Refresh encrypted WPS session
        run: |
          last_refresh="$(cat last-wps-refresh 2>/dev/null || echo 0)"
          now="$(date +%s)"
          if [ ! -f "$WPS_STORAGE_STATE_OUTPUT" ] || [ $((now - last_refresh)) -lt 36000 ]; then
            exit 0
          fi
          mkdir -p secrets
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:CATALOG_PASSPHRASE \
            -in "$WPS_STORAGE_STATE_OUTPUT" \
            -out secrets/wps-state.enc
          printf '%s\n' "$now" > last-wps-refresh
          git config user.name 'quote-sync-bot'
          git config user.email 'quote-sync-bot@users.noreply.github.com'
          git add secrets/wps-state.enc last-wps-refresh
          git commit -m "chore: refresh encrypted WPS session"
          git push
