name: Sync quote data

on:
  workflow_dispatch:

concurrency:
  group: shanshui-quote-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WPS_SKIP_IMAGES: '1'
      CATALOG_PASSPHRASE: ${{ secrets.CATALOG_PASSPHRASE }}
      VITE_CATALOG_PASSPHRASE: ${{ secrets.CATALOG_PASSPHRASE }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      KDOCS_TOKEN: ${{ secrets.KDOCS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install kdocs-cli
        run: |
          curl -fsSL https://wpsai.wpscdn.cn/skillhub/pro/v2.7.1/releases/kdocs-cli-2.7.1-linux-amd64.tar.gz -o /tmp/kdocs-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/kdocs-cli.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/kdocs-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kdocs-cli version

      - name: Check for changes
        id: check
        run: node scripts/check-version.mjs

      - name: Sync original workbook
        if: steps.check.outputs.changed == 'true'
        run: npm run sync:data

      - name: Encrypt and build
        if: steps.check.outputs.changed == 'true'
        run: |
          npm run protect
          npm run build

      - name: Deploy to EdgeOne
        if: steps.check.outputs.changed == 'true'
        run: |
          npx edgeone makers deploy dist \
            --name shanshui-quote-public \
            --env production \
            --area overseas \
            --skip-ai-gateway-sync \
            --token "$EDGEONE_API_TOKEN"

      - name: Persist last-mtime
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'quote-sync-bot'
          git config user.email 'quote-sync-bot@users.noreply.github.com'
          git add last-mtime
          git commit -m "chore: update last-mtime" || echo "no change"
          git pull --rebase origin main || true
          git push
